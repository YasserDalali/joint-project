services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finrisk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  finrisk-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finrisk-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-FinRiskDB}
      DB_USER: sa
      DB_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD}
      SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD}
    ports:
      # Host 18080 avoids collisions with local Spring Boot dev servers on :8080
      - "18080:8080"

  # Local code quality: http://localhost:9000 (first login admin/admin, then create a user token for scans)
  sonarqube:
    image: sonarqube:lts-community
    container_name: finrisk-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    mem_limit: 3g

volumes:
  sqlserver_data:
  sonarqube_data:
